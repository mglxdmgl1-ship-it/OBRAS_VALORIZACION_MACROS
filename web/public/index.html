<html lang="es">
<head>

  <meta name="description" content="Costos y presupuestos, A.C.U., control diario de metrados e insumos, almacén, equipo mecánico y valorización mensual de obras por administración directa.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Cpath d='M7 24h18M9 24V13l7-5 7 5v11M13 24v-6h6v6' stroke='%23f4b942' stroke-width='2.2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">

<body>
  <div id="acceso" hidden></div>
  <div id="app">

      <div class="marca">
        <svg viewBox="0 0 32 32" class="logo"><rect width="32" height="32" rx="7" fill="#f4b942"/><path d="M7 24h18M9 24V13l7-5 7 5v11M13 24v-6h6v6" stroke="#1f3a5f" stroke-width="2.4" fill="none" stroke-linejoin="round"/></svg>
        <div><strong>SGO</strong><span>Costos · Presupuestos · Valorizaciones</span></div>

      <nav id="menu"></nav>
      <div class="lateral-pie" id="lateral-pie">Obras por administración directa.<br>Descargue respaldos con frecuencia.</div>

          <span id="estado-guardado" class="estado-guardado">—</span>
          <div id="usuario" class="usuario" hidden></div>
        </div>
      </header>
      <main id="vista"><div class="cargando-inicial"><div class="spinner"></div>Cargando…</div></main>
    </div>
  </div>
